[package]
name = "volt"
version = "0.5.1"
description = "Lightweight AI-powered terminal with NVIDIA NIM"
authors = ["mohit"]
edition = "2021"

[lib]
name = "volt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime (stripped down features)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }

# Optimized memory allocator
mimalloc = { version = "0.1", default-features = false }

# PTY for terminal emulation
portable-pty = "0.8"

# HTTP client for NIM API
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
dirs = "5"

[profile.release]
opt-level = "s"  # Optimize for size
lto = true
strip = true
codegen-units = 1
panic = "abort"
